name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/photography-premium-preview-8x133v]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        # enablement turns Pages on for the repo if it is not already,
        # so this deploys without anyone visiting the settings screen
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Assemble site
        # Ship only what the site needs — no .git, no README, no workflow
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r assets _site/
          touch _site/.nojekyll
          echo "assembled $(find _site -type f | wc -l) files"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
