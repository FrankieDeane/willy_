name: Deploy to GitHub Pages

# The default branch of this repository is currently the long claude/… branch
# below. If it is ever renamed (to `main`, say), add the new name here — both
# are listed so a rename does not silently stop deploys.
on:
  push:
    branches:
      - main
      - claude/photography-premium-preview-8x133v
  workflow_dispatch:

# Least privilege: the job can read the code and publish Pages, nothing else.
# It cannot push a commit, open a pull request, or touch another repository.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false          # let a running publish finish

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          # No git credential is left behind in the runner's checkout. Nothing
          # in this job pushes, so nothing needs one.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Verify the committed pages match their sources
        # The HTML is generated, so it can drift from tools/*.json if someone
        # edits a page by hand. Rebuilding and diffing turns that into a failed
        # check instead of a silent inconsistency between the two languages.
        run: |
          node tools/build.mjs
          if ! git diff --quiet; then
            echo "::error::The committed pages do not match tools/. Run 'node tools/build.mjs' and commit the result."
            git diff --stat
            exit 1
          fi

      - name: Scan for credentials
        run: node tools/scan-secrets.mjs

      - name: Check the security policy is identical across hosts
        # vercel.json, _headers and the <meta> tag in every page carry the
        # same CSP because each host enforces it differently. This fails if
        # they drift, and rejects a vercel.json key Vercel would refuse.
        run: node tools/check-config.mjs

      - uses: actions/configure-pages@v6
        with:
          enablement: true           # turns Pages on without a visit to Settings

      - name: Assemble site
        # Ship only what a visitor needs: no build tooling, no docs, no git.
        run: |
          mkdir -p _site
          cp index.html work.html prints.html selection.html about.html contact.html _site/
          cp robots.txt sitemap.xml _headers _site/
          cp -r albums es assets _site/
          rm -rf _site/assets/img/_incoming
          touch _site/.nojekyll
          echo "assembled $(find _site -type f | wc -l) files, $(du -sh _site | cut -f1)"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
