name: Process uploaded photographs

# The browser-only route for adding photographs, for when there is no Node on
# hand. Drop the Drive folders into assets/img/_incoming/ on a branch called
# `photos` (see README, "Cargar las fotos"). This job renames them, strips
# their metadata, writes the three web sizes, regenerates the pages, and
# deletes the originals it consumed.
#
# It runs only on that branch, never on the default one, so an accidental
# upload cannot rewrite the live site on its own.
on:
  push:
    branches: ['photos', 'photos-**']
  workflow_dispatch:

permissions:
  contents: write            # the one workflow that writes, and only to its own branch

concurrency:
  group: photos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the image toolchain
        # `npm ci` installs exactly what tools/package-lock.json pins, by
        # integrity hash. It fails rather than resolving a newer version.
        run: npm --prefix tools ci

      - name: Rename, strip metadata, resize
        run: node tools/prepare-photos.mjs --consume

      - name: Rebuild the site
        run: node tools/build.mjs

      - name: Commit the result
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing changed — no folders matched a series in tools/albums.json"
            exit 0
          fi
          git commit -m "photos: process uploads and rebuild"
          git push origin HEAD:${{ github.ref_name }}

      - name: What to do next
        run: |
          echo "::notice::Open a pull request from '${{ github.ref_name }}' and use **Squash and merge**."
          echo "::notice::Squashing keeps the full-size originals out of the default branch's history."
          echo "::notice::Then delete the '${{ github.ref_name }}' branch — the originals leave with it."
